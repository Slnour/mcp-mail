[project]
name = "mcp-mail"
version = "0.1.0"
description = "MCP server for a single IMAP/SMTP mailbox, over Streamable HTTP with GitHub OAuth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4.5,<4",
    "imap-tools>=1.14.0,<2",
    "anyio>=4.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
]

[project.scripts]
mail-mcp = "mail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_mcp"]
